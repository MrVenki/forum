name: Commons image scan (temporary)

on:
  push:
    branches: [claude/project-thread-oo94zi]
    paths: [scripts/commons/**, .github/workflows/commons-scan.yml]

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/commons/scan.mjs > scan.json
      - run: |
          node -e "const s=require('fs').readFileSync('scan.json','utf8');const j=JSON.parse(s.split('COMMONS_SCAN_JSON_START')[1].split('COMMONS_SCAN_JSON_END')[0]);console.log('hits',j.length);console.log(Buffer.from(JSON.stringify(j)).toString('base64').match(/.{1,30000}/g).join('\n'))"
