name: Commons image scan (temporary)

on:
  push:
    branches: [claude/project-thread-oo94zi]
    paths: [scripts/commons/download.txt, .github/workflows/commons-scan.yml]

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download candidate photos from Wikimedia Commons
        run: |
          mkdir -p scripts/commons/candidates
          while read -r name url; do
            [ -z "$name" ] && continue
            curl -fsSL -A "IndiaPropertyTalk-image-scan/1.0 (https://indiapropertytalk.com)" -o "scripts/commons/candidates/$name" "$url" || echo "failed $name"
            sleep 1
          done < scripts/commons/download.txt
          ls -la scripts/commons/candidates
      - name: Commit them to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add scripts/commons/candidates
          git commit -m "chore: Commons candidate photos for review" && git push
